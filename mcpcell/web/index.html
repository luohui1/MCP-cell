<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="MCP-cell，本地优先的工具发现与治理工作台。">
  <title>MCP-cell · 工具工作台</title>
  <link rel="stylesheet" href="/style.css">
  <script defer src="/app.js"></script>
</head>
<body>
  <a class="skip" href="#main">跳到主要内容</a>
  <div class="app-shell">
    <aside class="sidebar" aria-label="主导航">
      <a class="brand" href="#overview" aria-label="MCP-cell 首页"><span class="brand-mark"><i></i><i></i><i></i></span><span>MCP<span class="brand-light">cell</span></span></a>
      <div class="workspace-badge"><span class="device-mark">⌘</span><div><strong>个人工作空间</strong><small>LOCAL WORKSPACE</small></div><span class="tiny-dot"></span></div>
      <p class="nav-caption">工作台</p>
      <nav id="navigation">
        <button class="nav-item active" data-view="overview" aria-current="page"><span data-icon="grid"></span>概览</button>
        <button class="nav-item" data-view="services"><span data-icon="layers"></span>服务清单<span id="service-count" class="nav-count">—</span></button>
        <button class="nav-item" data-view="clients"><span data-icon="devices"></span>AI 客户端</button>
        <button class="nav-item" data-view="review"><span data-icon="shield"></span>审查与迁移<span class="nav-indicator"></span></button>
      </nav>
      <p class="nav-caption extension-caption">扩展</p>
      <button class="nav-item" data-view="cli"><span data-icon="terminal"></span>CLI 接入<span class="soon">规划中</span></button>
      <div class="sidebar-spacer"></div>
      <div class="local-note"><span data-icon="lock"></span><strong>配置留在本机</strong><p>不上传、不执行<br>从只读发现开始。</p></div>
      <button class="nav-item about-button" data-view="about"><span data-icon="settings"></span>能力与边界</button>
      <div class="sidebar-footer"><span class="tiny-dot"></span>Discovery preview<span>0.1.0α</span></div>
    </aside>
    <div class="content-shell">
      <header class="topbar">
        <div class="breadcrumb">工作空间<span>/</span><strong id="crumb">概览</strong></div>
        <div class="topbar-actions"><span id="mode-badge" class="tag neutral">正在连接</span><button id="search-shortcut" class="icon-button" aria-label="搜索服务，快捷键 Ctrl K"><span data-icon="search"></span></button><span class="avatar" aria-label="本地用户">M</span></div>
      </header>
      <main id="main" tabindex="-1"><div class="loading-state"><span class="brand-mark"><i></i><i></i><i></i></span><h1>正在连接本地工作台</h1><p>仅读取配置清单，不会启动工具。</p></div></main>
      <footer class="main-footer"><span><span class="tiny-dot"></span>LOCAL FIRST, ALWAYS.</span><span id="footer-status">MCP-cell · 发现、审查、再接入</span></footer>
    </div>
  </div>
  <dialog id="detail" class="detail-dialog" aria-labelledby="detail-title"><div id="detail-body"></div></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
