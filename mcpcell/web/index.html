<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light"><title>MCPcell</title>
<link rel="stylesheet" href="/style.css"><script defer src="/app.js"></script>
</head>
<body>
<div class="window">
  <header class="titlebar"><a class="brand" href="#" aria-label="MCPcell"><span class="mark" aria-hidden="true"><i></i><i></i></span>MCPCELL<span class="version">0.2</span></a><div class="window-tools"><span id="connection" class="connection"><i></i>本地管理器</span><button id="settings" class="icon-button" aria-label="设置与诊断"></button></div></header>
  <main>
    <div class="heading"><div><h1>MCP 管理</h1><p id="subtitle">检测已有配置，接入统一管理。</p></div><button class="button" id="scan"><span id="scan-icon"></span><span>检测 MCP</span></button></div>
    <div class="toolbar"><div class="tabs" role="tablist" aria-label="MCP 列表"><button role="tab" id="tab-all" data-tab="all" aria-selected="true">全部 <span>0</span></button><button role="tab" id="tab-managed" data-tab="managed" aria-selected="false">已接入 <span>0</span></button></div><div class="filters"><label class="search"><span id="search-icon"></span><input id="search" placeholder="搜索 MCP" type="search" aria-label="搜索 MCP"></label><select id="client" aria-label="来源客户端"><option value="all">所有来源</option></select></div></div>
    <div class="list-heading"><label class="check-wrap"><input type="checkbox" id="select-all" aria-label="选择当前列表可接入的 MCP"><span>MCP / 来源</span></label><span>状态</span><span class="align-right">操作</span></div>
    <div id="list" class="list" role="region" aria-label="MCP 服务列表" tabindex="-1"><div class="empty"><h2>正在检测…</h2></div></div>
    <div class="actionbar"><div id="selection">勾选需要统一管理的 MCP</div><button id="enroll-selected" class="button primary" disabled>接入所选<span id="selected-count"></span><span id="arrow-icon"></span></button></div>
  </main>
  <footer><div><span class="status-dot"></span><span id="summary">准备就绪</span><button id="diagnostics" hidden></button></div><div id="runtime">运行 0<span class="separator">/</span>0 MB</div></footer>
</div>
<dialog id="dialog" aria-labelledby="dialog-title"><div id="dialog-content"></div></dialog>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
